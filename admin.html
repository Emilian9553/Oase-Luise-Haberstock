<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Content Manager - Oma Isi Webseite</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Lora:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
    <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
    <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
  </head>
  <body>
    <script>
      CMS.init({
        config: {
          backend: {
            name: 'git-gateway',
            branch: 'main'
          },
          media_folder: "images",
          public_folder: "/images",
          collections: [
            {
              name: "angebote",
              label: "Angebote & Seminare",
              files: [
                {
                  label: "Termine",
                  name: "termine",
                  file: "angebote.json",
                  fields: [
                    {
                      name: "seminare",
                      label: "Seminare",
                      widget: "list",
                      fields: [
                        {label: "Datum", name: "datum", widget: "string"},
                        {label: "Titel", name: "titel", widget: "string"},
                        {label: "Zeit", name: "zeit", widget: "string", default: "9:30 - 18:00 Uhr"},
                        {label: "Preis", name: "preis", widget: "string"}
                      ]
                    },
                    {
                      name: "reiki",
                      label: "Reiki-Angebote",
                      widget: "list",
                      fields: [
                        {label: "Datum", name: "datum", widget: "string"},
                        {label: "Titel", name: "titel", widget: "string"},
                        {label: "Zeit", name: "zeit", widget: "string", default: "9:30 - 18:00 Uhr"},
                        {label: "Preis", name: "preis", widget: "string"}
                      ]
                    }
                  ]
                }
              ]
            }
          ]
        }
      });

      try {
        CMS.registerPreviewStyle("style.css");

        var TerminePreview = createClass({
          render: function() {
            var entry = this.props.entry;
            var seminare = entry.getIn(['data', 'seminare']);
            var reiki = entry.getIn(['data', 'reiki']);

            var seminareHTML = [];
            if (seminare) {
              seminareHTML = seminare.map(function(item, index) {
                return h('div', {className: 'seminar-card', key: index}, 
                  h('div', {className: 'seminar-date'}, item.get('datum')),
                  h('div', {className: 'seminar-title'}, item.get('titel')),
                  h('div', {className: 'seminar-details'}, 
                    h('span', {className: 'seminar-time'}, item.get('zeit')),
                    h('span', {className: 'seminar-price'}, item.get('preis'))
                  )
                );
              }).toArray();
            }

            var reikiHTML = [];
            if (reiki) {
              reikiHTML = reiki.map(function(item, index) {
                return h('div', {className: 'seminar-card', key: index}, 
                  h('div', {className: 'seminar-date'}, item.get('datum')),
                  h('div', {className: 'seminar-title'}, item.get('titel')),
                  h('div', {className: 'seminar-details'}, 
                    h('span', {className: 'seminar-time'}, item.get('zeit')),
                    h('span', {className: 'seminar-price'}, item.get('preis'))
                  )
                );
              }).toArray();
            }

            return h('div', {style: {padding: '2rem'}}, 
              h('section', {id: 'seminare'},
                h('h3', {}, 'Anstehende Seminare'),
                h('div', {className: 'seminar-grid'}, seminareHTML),
                h('h3', {style: {marginTop: '3rem'}}, 'Reiki-Angebote'),
                h('div', {className: 'seminar-grid'}, reikiHTML)
              )
            );
          }
        });

        CMS.registerPreviewTemplate("termine", TerminePreview);
      } catch(e) {
        console.error("Vorschau konnte nicht geladen werden", e);
      }
    </script>
  </body>
</html>
