backend:
  name: git-gateway
  branch: main

media_folder: "images"
public_folder: "/images"

collections:
  - name: "angebote"
    label: "Angebote & Seminare"
    files:
      - label: "Termine"
        name: "termine"
        file: "angebote.json"
        fields:
          - name: seminare
            label: Seminare
            widget: list
            summary: "{{datum}} – {{titel}} ({{preis}}) [{{status}}]"
            fields:
              - {label: "Datum", name: "datum", widget: "string"}
              - {label: "Titel", name: "titel", widget: "string"}
              - {label: "Zeit", name: "zeit", widget: "string", default: "9:30 - 18:00 Uhr"}
              - {label: "Preis", name: "preis", widget: "string"}
              - label: "Status"
                name: "status"
                widget: "select"
                options: ["Aktiv", "Abgesagt"]
                default: "Aktiv"
          - name: reiki
            label: Reiki-Angebote
            widget: list
            summary: "{{datum}} – {{titel}} ({{preis}}) [{{status}}]"
            fields:
              - {label: "Datum", name: "datum", widget: "string"}
              - {label: "Titel", name: "titel", widget: "string"}
              - {label: "Zeit", name: "zeit", widget: "string", default: "9:30 - 18:00 Uhr"}
              - {label: "Preis", name: "preis", widget: "string"}
              - label: "Status"
                name: "status"
                widget: "select"
                options: ["Aktiv", "Abgesagt"]
                default: "Aktiv"
